{{- if not .Values.config.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ccc-jira-watcher.fullname" . }}-config
  labels:
    {{- include "ccc-jira-watcher.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.core.json: |
    {
      "bot_token": {{ .Values.ccc.core.botToken | quote }},
      "chat_id": {{ int64 .Values.ccc.core.chatId }},
      "group_id": {{ int64 .Values.ccc.core.groupId }},
      "multi_user_mode": {{ .Values.ccc.core.multiUserMode }},
      "projects_dir": {{ .Values.ccc.core.projectsDir | quote }},
      "enable_streaming": {{ .Values.ccc.core.enableStreaming }},
      "relay_url": {{ .Values.ccc.core.relayUrl | quote }},
      "away": {{ .Values.ccc.core.away }},
      "oauth_token": {{ .Values.ccc.core.oauthToken | quote }},
      "otp_secret": {{ .Values.ccc.core.otpSecret | quote }}
    }
  config.sessions.json: |
    {
      "sessions": {{ .Values.ccc.sessions.sessions | toJson }},
      "team_sessions": {{ .Values.ccc.sessions.teamSessions | toJson }}
    }
  config.providers.json: |
    {
      "active_provider": {{ .Values.ccc.providers.activeProvider | quote }},
      "providers": {{ .Values.ccc.providers.providers | toJson }},
      "provider": {{ .Values.ccc.providers.provider | toJson }}
    }
  {{- if .Values.jira.configFromValues }}
  jira.json: |
    {
      "base_url": {{ .Values.jira.baseUrl | quote }},
      "auth_method": {{ .Values.jira.authMethod | quote }},
      "auth_env_var": "CCC_JIRA_AUTH_TOKEN",
      "auth_email_env_var": {{ ternary "CCC_JIRA_AUTH_EMAIL" "" (or (ne .Values.jira.authEmail "") (eq .Values.jira.authMethod "basic")) | quote }},
      "jql": {{ .Values.jira.jql | quote }},
      "claim_transition": {{ .Values.jira.claimTransition | quote }},
      "claim_status": {{ .Values.jira.claimStatus | quote }},
      "repo_field": {{ .Values.jira.repoField | quote }},
      "repo_fallback_env_var": {{ ternary "CCC_JIRA_REPO_FALLBACK" "" (ne .Values.jira.repoFallback "") | quote }},
      "acceptance_criteria_field": {{ .Values.jira.acceptanceCriteriaField | quote }},
      "poll_interval": {{ .Values.jira.pollInterval | quote }},
      "max_tickets_per_cycle": {{ int .Values.jira.maxTicketsPerCycle }}
    }
  {{- end }}
{{- end }}
---
{{- if and (or .Values.jira.configFromEnv .Values.jira.configFromValues) (not .Values.jira.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ccc-jira-watcher.fullname" . }}-jira
  labels:
    {{- include "ccc-jira-watcher.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.jira.authTokenKey }}: {{ .Values.jira.authToken | quote }}
  {{- if .Values.jira.authEmail }}
  {{ .Values.jira.authEmailKey }}: {{ .Values.jira.authEmail | quote }}
  {{- end }}
{{- end }}
